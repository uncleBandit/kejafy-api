# ---------------------------------------------------------------------------
# Kejafy API — PRODUCTION stack (its own server, once it outgrows the shared
# MVP server)
#
# The server never builds: GitHub Actions builds the image and pushes it to
# GHCR, then deploy-production runs, in /opt/kejafy on the server:
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d --remove-orphans
#
# Everything is configured from /opt/kejafy/.env (see
# deploy/.env.production.example). Hibernate updates the schema on startup.
# ---------------------------------------------------------------------------

name: kejafy-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No published port: reachable only on the internal network.

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/unclebandit/kejafy-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      target: prod
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_JPA_SHOW_SQL: "false"
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: caddy:2.8-alpine
    restart: always
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@unclecanvas.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: must persist, or every restart asks Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config

  # Nightly compressed dump of the database, keeping the last BACKUP_KEEP_DAYS.
  backup:
    image: postgres:17-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/kejafy-$$(date +%Y%m%d-%H%M).dump
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
          else
            echo "backup FAILED" >&2; rm -f "$$file"
          fi
          find /backups -name 'kejafy-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  caddy-data:
  caddy-config:
