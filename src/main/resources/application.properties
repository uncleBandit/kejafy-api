spring.application.name=KejaFy

# ==========================================
# PostgreSQL
# ==========================================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Redis
# ==========================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}


# ==========================================
# Google OAuth2
# ==========================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.cors.allowed-origins=http://localhost:5173
app.frontend.base-url=http://localhost:5173

# ==========================================
# OpenAPI / Swagger
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Disable in prod so you're not exposing your API shape publicly
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:true}

# ==========================================
# Subscription pricing (server-side only — never trust a client-sent
# amount; PaymentService always looks the price up from here)
# ==========================================
app.subscription.pricing.monthly=${SUBSCRIPTION_PRICE_MONTHLY:999}
app.subscription.pricing.yearly=${SUBSCRIPTION_PRICE_YEARLY:9999}
app.subscription.pricing.currency=${SUBSCRIPTION_CURRENCY:KES}

# ==========================================
# M-Pesa (Safaricom Daraja) — STK Push / Lipa na M-Pesa Online
# ==========================================
# sandbox.safaricom.co.ke for testing, api.safaricom.co.ke once you've
# gone through Safaricom's go-live process for your paybill/till.
app.mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
app.mpesa.consumer-key=${MPESA_CONSUMER_KEY}
app.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET}
app.mpesa.shortcode=${MPESA_SHORTCODE}
app.mpesa.passkey=${MPESA_PASSKEY}
# Must be a publicly reachable HTTPS URL — Safaricom will not call
# localhost. Tunnel it (ngrok/cloudflared) for local dev.
app.mpesa.callback-url=${MPESA_CALLBACK_URL}

# ==========================================
# Stripe (card payments)
# ==========================================
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}